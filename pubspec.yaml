name: bitacora_campo
description: Memoria de campo por ubicación — fotos, dictado y GPS guardados localmente.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Almacenamiento local
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  # Gadgets
  image_picker: ^1.1.2      # cámara y galería
  speech_to_text: ^7.0.0    # micrófono → texto
  geolocator: ^13.0.1       # GPS
  # Mapas
  flutter_map: ^7.0.2       # mapa interactivo (OpenStreetMap, sin API key)
  latlong2: ^0.9.1
  url_launcher: ^6.3.0      # abrir Google Maps

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
